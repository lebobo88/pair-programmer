<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 680" fill="none">
  <title>pair-programmer Run Lifecycle</title>
  <desc>Vertical flow diagram showing the full lifecycle of a /pp:run from request intake through finalization.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #24292f; }
    .label { font-size: 11px; fill: #24292f; }
    .sublabel { font-size: 9.5px; fill: #57606a; }
    .step { rx: 6; stroke-width: 1.5; }
    .arrow { stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .loop-box { rx: 10; stroke-width: 2; stroke-dasharray: 6,3; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #e6edf3; }
      .label { fill: #e6edf3; }
      .sublabel { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Step 1: Request -->
  <rect x="250" y="15" width="200" height="40" class="step" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="350" y="40" text-anchor="middle" class="title">Request Intake</text>

  <path d="M350,55 L350,75" class="arrow" stroke="#57606a"/>

  <!-- Step 2: Triage -->
  <rect x="250" y="75" width="200" height="40" class="step" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="350" y="93" text-anchor="middle" class="label">Triage (scope: minor/major)</text>
  <text x="350" y="106" text-anchor="middle" class="sublabel">heuristic NLP classification</text>

  <path d="M350,115 L350,135" class="arrow" stroke="#57606a"/>

  <!-- Step 3: Profile Detect -->
  <rect x="250" y="135" width="200" height="40" class="step" fill="#fff8c5" stroke="#bf8700"/>
  <text x="350" y="153" text-anchor="middle" class="label">Profile Detection</text>
  <text x="350" y="166" text-anchor="middle" class="sublabel">16 built-in profiles, auto-detect from manifests</text>

  <path d="M350,175 L350,195" class="arrow" stroke="#57606a"/>

  <!-- Step 4: Taxonomy Map -->
  <rect x="250" y="195" width="200" height="40" class="step" fill="#fff8c5" stroke="#bf8700"/>
  <text x="350" y="213" text-anchor="middle" class="label">Taxonomy Mapping</text>
  <text x="350" y="226" text-anchor="middle" class="sublabel">16 sections, required artifacts per profile</text>

  <path d="M350,235 L350,265" class="arrow" stroke="#57606a"/>

  <!-- Stage Loop Container -->
  <rect x="100" y="265" width="500" height="220" class="loop-box" fill="#f6f8fa" stroke="#8250df"/>
  <text x="350" y="285" text-anchor="middle" class="title" fill="#8250df">Stage Loop (spec → architecture → code → tests → docs → ...)</text>

  <!-- Generate -->
  <rect x="140" y="300" width="180" height="45" class="step" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="230" y="320" text-anchor="middle" class="label">Generate Artifact</text>
  <text x="230" y="335" text-anchor="middle" class="sublabel">Claude / Codex / Gemini sub-agent</text>

  <path d="M320,322 L370,322" class="arrow" stroke="#57606a"/>

  <!-- Judge -->
  <rect x="370" y="300" width="200" height="45" class="step" fill="#ffebe9" stroke="#cf222e"/>
  <text x="470" y="320" text-anchor="middle" class="label">Cross-Vendor Judge</text>
  <text x="470" y="335" text-anchor="middle" class="sublabel">different model validates artifact</text>

  <!-- Pass path -->
  <path d="M470,345 L470,370" class="arrow" stroke="#1a7f37"/>
  <text x="490" y="365" class="sublabel" fill="#1a7f37">pass</text>

  <rect x="390" y="370" width="160" height="35" class="step" fill="#dcffe4" stroke="#1a7f37"/>
  <text x="470" y="392" text-anchor="middle" class="label">Archive Artifact</text>

  <!-- Fail path -->
  <path d="M370,330 L350,330 L350,380 L230,380 L230,410" class="arrow" stroke="#cf222e"/>
  <text x="290" y="375" class="sublabel" fill="#cf222e">fail (max 1 retry)</text>

  <!-- Reflexion -->
  <rect x="140" y="410" width="180" height="45" class="step" fill="#ffebe9" stroke="#cf222e"/>
  <text x="230" y="430" text-anchor="middle" class="label">Reflexion Retry</text>
  <text x="230" y="445" text-anchor="middle" class="sublabel">critique fed back to generator</text>

  <path d="M320,432 L370,432 L370,345 L470,345" class="arrow dashed" stroke="#cf222e"/>

  <!-- After loop -->
  <path d="M350,485 L350,510" class="arrow" stroke="#57606a"/>

  <!-- Missability -->
  <rect x="230" y="510" width="240" height="40" class="step" fill="#dcffe4" stroke="#1a7f37"/>
  <text x="350" y="528" text-anchor="middle" class="label">Missability Gates (56 checks)</text>
  <text x="350" y="541" text-anchor="middle" class="sublabel">NFRs, authz, data retention, rollout safety</text>

  <path d="M350,550 L350,570" class="arrow" stroke="#57606a"/>

  <!-- Master Plan Patch -->
  <rect x="230" y="570" width="240" height="40" class="step" fill="#fff8c5" stroke="#bf8700"/>
  <text x="350" y="588" text-anchor="middle" class="label">Patch PROJECT_MASTER.md</text>
  <text x="350" y="601" text-anchor="middle" class="sublabel">20-section template, auto-scaffolded</text>

  <path d="M350,610 L350,630" class="arrow" stroke="#57606a"/>

  <!-- Finalize -->
  <rect x="250" y="630" width="200" height="40" class="step" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="350" y="648" text-anchor="middle" class="title">Finalize Run</text>
  <text x="350" y="661" text-anchor="middle" class="sublabel">status: complete | surfaced</text>
</svg>
